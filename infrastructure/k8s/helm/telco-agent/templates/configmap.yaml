apiVersion: v1
kind: ConfigMap
metadata:
  name: telco-agent-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "telco-agent.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: "telco-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "telcoagent"
  REDIS_HOST: "telco-redis"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "telco-kafka:9092"
  CUSTOMER_SERVICE_URL: "http://telco-customer-service:8001/v1/customers"
  BILLING_SERVICE_URL: "http://telco-billing-service:8002/v1/billing"
  NETWORK_SERVICE_URL: "http://telco-network-service:8003/v1/network"
  CAMPAIGN_SERVICE_URL: "http://telco-campaign-service:8004/v1/campaigns"
