# ============================================================
# Prometheus Configuration — TelcoAgent Platform
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Domain services
  - job_name: "customer-service"
    static_configs:
      - targets: ["customer-service:8001"]

  - job_name: "billing-service"
    static_configs:
      - targets: ["billing-service:8002"]

  # Agent services
  - job_name: "customer-support-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["customer-support-agent:8010"]
