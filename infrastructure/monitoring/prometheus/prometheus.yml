# ============================================================
# Prometheus Configuration — TelcoAgent Platform
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Domain services
  - job_name: "customer-service"
    static_configs:
      - targets: ["customer-service:8001"]

  - job_name: "billing-service"
    static_configs:
      - targets: ["billing-service:8002"]

  - job_name: "network-service"
    static_configs:
      - targets: ["network-service:8003"]

  - job_name: "campaign-service"
    static_configs:
      - targets: ["campaign-service:8004"]

  # Agent services
  - job_name: "customer-support-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["customer-support-agent:8010"]

  - job_name: "orchestrator-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["orchestrator-agent:8011"]
