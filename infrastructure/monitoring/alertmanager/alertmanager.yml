# ============================================================
# Alertmanager Configuration — TelcoAgent Platform
# ============================================================
# Routes alerts to appropriate receivers.
# In production, replace webhook with PagerDuty/Slack/OpsGenie.
# ============================================================

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "default-webhook"

  routes:
    - match:
        severity: critical
      receiver: "default-webhook"
      group_wait: 0s
      repeat_interval: 5m

receivers:
  - name: "default-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:9999/alerts"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
