# ============================================================
# TelcoAgent Platform — Local Development Stack
# ============================================================
# Usage: docker compose up -d
# Tear down: docker compose down -v
# ============================================================

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: telco-postgres
    environment:
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telco-net

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: telco-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telco-net

  # ── ZooKeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: telco-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telco-net

  # ── Kafka (ZooKeeper mode) ──────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: telco-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - telco-net

  # ── Customer Service ───────────────────────────────────────
  customer-service:
    build:
      context: .
      dockerfile: services/customer/Dockerfile
    container_name: telco-customer-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEV_MODE: ${DEV_MODE:-false}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - telco-net

  # ── Billing Service ────────────────────────────────────────
  billing-service:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: telco-billing-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEV_MODE: ${DEV_MODE:-false}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - telco-net

  # ── Network Service ────────────────────────────────────────
  network-service:
    build:
      context: .
      dockerfile: services/network/Dockerfile
    container_name: telco-network-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEV_MODE: ${DEV_MODE:-false}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - telco-net

  # ── Campaign Service ────────────────────────────────────────
  campaign-service:
    build:
      context: .
      dockerfile: services/campaign/Dockerfile
    container_name: telco-campaign-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DEV_MODE: ${DEV_MODE:-false}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - telco-net

  # ── Kafka UI ───────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: telco-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: telco-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8082:8080"
    networks:
      - telco-net

  # ── Customer Support Agent ─────────────────────────────────
  customer-support-agent:
    build:
      context: .
      dockerfile: agents/customer_support/Dockerfile
    container_name: telco-customer-support-agent
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CUSTOMER_SERVICE_URL: http://customer-service:8001/v1/customers
      BILLING_SERVICE_URL: http://billing-service:8002/v1/billing
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-deepseek-api-key}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-your-langsmith-key}
      LANGCHAIN_PROJECT: telco-agent-platform
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_started
      billing-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/v1/agent`)"
      - "traefik.http.services.agent.loadbalancer.server.port=8010"
    networks:
      - telco-net

  # ── Traefik (API Gateway — Week 1-6) ──────────────────────
  traefik:
    image: traefik:v3.2
    container_name: telco-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"
      - "8084:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - telco-net

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: telco-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    networks:
      - telco-net

  # ── Alertmanager ─────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: telco-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./infrastructure/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - telco-net

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: telco-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - telco-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  prometheus_data:
  grafana_data:

# ── Network ──────────────────────────────────────────────────
networks:
  telco-net:
    driver: bridge
