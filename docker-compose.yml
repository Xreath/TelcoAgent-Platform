version: "3.9"

# ============================================================
# TelcoAgent Platform — Local Development Stack
# ============================================================
# Usage: docker compose up -d
# Tear down: docker compose down -v
# ============================================================

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: telco-postgres
    environment:
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telco-net

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: telco-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telco-net

  # ── MongoDB ────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: telco-mongodb
    environment:
      MONGO_INITDB_DATABASE: telco_episodic
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telco-net

  # ── Qdrant ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: telco-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - telco-net

  # ── ZooKeeper ───────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: telco-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telco-net

  # ── Kafka (ZooKeeper mode) ──────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: telco-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - telco-net

  # ── Customer Service ───────────────────────────────────────
  customer-service:
    build:
      context: .
      dockerfile: services/customer/Dockerfile
    container_name: telco-customer-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - telco-net

  # ── Billing Service ────────────────────────────────────────
  billing-service:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: telco-billing-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: telco
      POSTGRES_PASSWORD: telco_secret
      POSTGRES_DB: telcoagent
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - telco-net

  # ── Schema Registry (Avro) ─────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: telco-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks:
      - telco-net

  # ── Kafka UI ───────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: telco-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: telco-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "8082:8080"
    networks:
      - telco-net

  # ── Keycloak ───────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: telco-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/telcoagent
      KC_DB_USERNAME: telco
      KC_DB_PASSWORD: telco_secret
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telco-net

  # ── Temporal ───────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25
    container_name: telco-temporal
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: telco
      POSTGRES_PWD: telco_secret
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telco-net

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: telco-temporal-ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8083:8080"
    depends_on:
      - temporal
    networks:
      - telco-net

  # ── Customer Support Agent ─────────────────────────────────
  customer-support-agent:
    build:
      context: .
      dockerfile: agents/customer_support/Dockerfile
    container_name: telco-customer-support-agent
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MONGO_HOST: mongodb
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CUSTOMER_SERVICE_URL: http://customer-service:8001/v1/customers
      BILLING_SERVICE_URL: http://billing-service:8002/v1/billing
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-deepseek-api-key}
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-your-langsmith-key}
      LANGCHAIN_PROJECT: telco-agent-platform
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer-service:
        condition: service_started
      billing-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.rule=PathPrefix(`/v1/agent`)"
      - "traefik.http.services.agent.loadbalancer.server.port=8010"
    networks:
      - telco-net

  # ── Traefik (API Gateway — Week 1-6) ──────────────────────
  traefik:
    image: traefik:v3.2
    container_name: telco-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"
      - "8084:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - telco-net

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: telco-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - telco-net

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: telco-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - telco-net

  # ── Loki ───────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.2.1
    container_name: telco-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - telco-net

  # ── Jaeger ─────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: telco-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - telco-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  mongo_data:
  qdrant_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  prometheus_data:
  grafana_data:
  loki_data:

# ── Network ──────────────────────────────────────────────────
networks:
  telco-net:
    driver: bridge
