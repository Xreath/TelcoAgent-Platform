# Alembic Configuration — TelcoAgent Platform
# ============================================================
# Run migrations:  alembic upgrade head
# New migration:   alembic revision --autogenerate -m "description"
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Async URL is set dynamically in env.py via environment variables.
# Leave this as a placeholder — env.py overrides it at runtime.
sqlalchemy.url = postgresql+asyncpg://telco:telco_secret@localhost:5432/telcoagent

[post_write_hooks]
# Automatically format generated migration files with ruff
hooks = ruff
ruff.type = exec
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
