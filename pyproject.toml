[project]
name = "telco-agent-platform"
version = "0.1.0"
description = "Enterprise Agentic AI Platform for Telecom Operations"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",

    # Redis
    "redis[hiredis]>=5.2.0",

    # MongoDB
    "motor>=3.6.0",

    # Kafka
    "aiokafka>=0.11.0",
    "confluent-kafka>=2.6.0",
    "fastavro>=1.9.0",

    # AI/Agent
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "autogen-agentchat>=0.4.0",
    "openai>=1.50.0",

    # MCP
    "fastmcp>=2.0.0",

    # Workflow
    "temporalio>=1.7.0",

    # gRPC
    "grpcio>=1.67.0",
    "grpcio-tools>=1.67.0",
    "protobuf>=5.28.0",

    # Observability
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-jaeger>=1.21.0",

    # Utilities
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "faker>=30.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
